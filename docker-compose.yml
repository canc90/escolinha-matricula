# Sistema ANTIGO (Node/Express + SQLite) — DESATIVADO.
# Foi substituído pela versão Laravel em ./laravel (veja laravel/README.md),
# que sobe com:  cd laravel && docker compose up -d
# Para subir o antigo mesmo assim:
#   docker compose --profile legacy up -d
services:
  app:
    profiles: ["legacy"]
    build: .
    ports:
      - "3000:3000"
    environment:
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - PORT=3000
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - ./database.sqlite:/app/database.sqlite
    restart: unless-stopped
